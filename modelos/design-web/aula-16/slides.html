*, *::before, *::after { box-sizing: border-box; }

:root {
  --ink: #0d1117;
  --ink-soft: #151b23;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-strong: rgba(255, 255, 255, 0.075);
  --line: rgba(255, 255, 255, 0.11);
  --line-strong: rgba(255, 255, 255, 0.2);
  --paper: #f7f5ee;
  --paper-soft: #c7cbd2;
  --muted: #89919d;
  --accent: #63e6d8;
  --accent-rgb: 99, 230, 216;
  --accent-2: #5b7cfa;
  --danger: #ff7a75;
  --success: #7fe0a3;
  --warning: #ffc86b;
  --display: "Avenir Next Condensed", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "SFMono-Regular", "Cascadia Code", "Fira Code", Consolas, monospace;
  --radius: 14px;
  --shadow: 0 26px 70px rgba(0, 0, 0, 0.32);
}

body[data-theme="av"] {
  --accent: #ffb45d;
  --accent-rgb: 255, 180, 93;
  --accent-2: #ff6d61;
  --ink: #12100f;
  --ink-soft: #1d1816;
}

html {
  min-height: 100%;
  background: var(--ink);
  color-scheme: dark;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  color: var(--paper);
  background:
    radial-gradient(circle at 10% 0%, rgba(var(--accent-rgb), 0.12), transparent 28rem),
    radial-gradient(circle at 95% 18%, rgba(var(--accent-rgb), 0.07), transparent 24rem),
    var(--ink);
  font-family: var(--body);
}

button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ===== Course dashboard ===== */

.course-shell {
  width: min(100% - 40px, 1320px);
  margin: 0 auto;
  padding: 28px 0 72px;
}

.course-topbar,
.lesson-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.course-topbar {
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.course-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--paper-soft);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: none;
}

.course-brand img {
  width: auto;
  height: 24px;
  opacity: 0.92;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--paper-soft);
  font-size: 13px;
  text-decoration: none;
  transition: color 160ms ease;
}

.back-link:hover,
.back-link:focus-visible { color: var(--accent); }

.course-hero {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(300px, 0.7fr);
  gap: 44px;
  align-items: end;
  padding: 72px 0 54px;
}

.course-kicker,
.slide-kicker {
  margin: 0 0 12px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.course-hero h1 {
  max-width: 840px;
  margin: 0;
  font-family: var(--display);
  font-size: clamp(48px, 7vw, 92px);
  font-weight: 750;
  letter-spacing: -0.045em;
  line-height: 0.94;
  text-wrap: balance;
}

.course-hero .course-lede {
  max-width: 720px;
  margin: 26px 0 0;
  color: var(--paper-soft);
  font-size: clamp(17px, 2vw, 21px);
  line-height: 1.6;
  text-wrap: pretty;
}

.course-facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 0;
}

.course-facts div {
  min-height: 98px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(var(--accent-rgb), 0.08), rgba(255, 255, 255, 0.025));
}

.course-facts dt {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.course-facts dd {
  margin: 8px 0 0;
  color: var(--paper);
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.teacher-promise {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  margin: 0 0 48px;
  padding: 24px 26px;
  border: 1px solid rgba(var(--accent-rgb), 0.28);
  border-radius: var(--radius);
  background: rgba(var(--accent-rgb), 0.075);
}

.teacher-promise .promise-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  border-radius: 50%;
  color: var(--ink);
  background: var(--accent);
  font-family: var(--mono);
  font-weight: 900;
}

.teacher-promise strong {
  display: block;
  margin-bottom: 5px;
  color: var(--accent);
  font-size: 13px;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.teacher-promise p {
  margin: 0;
  color: var(--paper-soft);
  font-size: 16px;
  line-height: 1.55;
}

.course-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
}

.course-tools h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 28px;
}

.lesson-search {
  width: min(100%, 360px);
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  color: var(--paper);
  background: rgba(255, 255, 255, 0.04);
}

.lesson-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.13);
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.lesson-card {
  position: relative;
  display: flex;
  min-height: 260px;
  flex-direction: column;
  padding: 24px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: inherit;
  background: rgba(255, 255, 255, 0.035);
  text-decoration: none;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}

.lesson-card::after {
  position: absolute;
  right: -44px;
  bottom: -56px;
  width: 160px;
  height: 160px;
  border: 1px solid rgba(var(--accent-rgb), 0.14);
  border-radius: 50%;
  content: "";
  transition: transform 220ms ease, border-color 220ms ease;
}

.lesson-card:hover,
.lesson-card:focus-visible {
  transform: translateY(-4px);
  border-color: rgba(var(--accent-rgb), 0.48);
  background: rgba(var(--accent-rgb), 0.055);
  outline: none;
}

.lesson-card:hover::after { transform: scale(1.15); border-color: rgba(var(--accent-rgb), 0.3); }

.lesson-card-num {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}

.lesson-card h3 {
  margin: 18px 0 10px;
  font-family: var(--display);
  font-size: 24px;
  line-height: 1.12;
}

.lesson-card p {
  display: -webkit-box;
  margin: 0 0 24px;
  overflow: hidden;
  color: var(--paper-soft);
  font-size: 14px;
  line-height: 1.5;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.lesson-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: auto;
  color: var(--muted);
  font-size: 12px;
}

.teacher-promise p {
  text-wrap: pretty;
}

.resource-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  margin-top: 12px;
}

.classroom-lab {
  margin: 0 0 54px;
  padding: clamp(24px, 4vw, 42px);
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) + 4px);
  background:
    linear-gradient(135deg, rgba(var(--accent-rgb), 0.075), transparent 42%),
    rgba(255, 255, 255, 0.025);
}

.classroom-lab__intro {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(320px, 1.2fr);
  gap: 36px;
  align-items: end;
}

.classroom-lab__intro h2 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(30px, 4vw, 48px);
  line-height: 1;
}

.classroom-lab__intro > p {
  margin: 0;
  color: var(--paper-soft);
  font-size: 16px;
  line-height: 1.65;
  text-wrap: pretty;
}

.lab-tool-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 30px;
}

.lab-tool-card {
  position: relative;
  display: flex;
  min-height: 260px;
  flex-direction: column;
  padding: 22px;
  overflow: hidden;
  border: 1px solid rgba(var(--accent-rgb), 0.25);
  border-radius: var(--radius);
  background: rgba(var(--accent-rgb), 0.055);
  text-decoration: none;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}

.lab-tool-card:hover,
.lab-tool-card:focus-visible {
  transform: translateY(-3px);
  border-color: var(--accent);
  background: rgba(var(--accent-rgb), 0.09);
  outline: none;
}

.lab-tool-card--local {
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.035);
}

.lab-tool-card__number {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.lab-tool-card__meta {
  margin: 28px 0 8px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.lab-tool-card strong {
  font-family: var(--display);
  font-size: 26px;
}

.lab-tool-card p {
  margin: 10px 0 22px;
  color: var(--paper-soft);
  font-size: 14px;
  line-height: 1.55;
}

.lab-tool-card__action {
  margin-top: auto;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}

.lab-flow {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin: 24px 0 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--line);
  list-style: none;
}

.lab-flow li {
  display: grid;
  gap: 7px;
  min-height: 110px;
  padding: 18px;
  background: var(--ink-soft);
}

.lab-flow strong {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.lab-flow span {
  color: var(--paper-soft);
  font-size: 13px;
  line-height: 1.45;
}

.lab-privacy {
  margin: 18px 0 0;
  padding-left: 16px;
  border-left: 3px solid var(--warning);
  color: var(--paper-soft);
  font-size: 13px;
  line-height: 1.55;
}

.lab-privacy strong { color: var(--warning); }

.lesson-card-footer strong { color: var(--paper); font-weight: 700; }
.lesson-card-arrow { color: var(--accent); font-size: 20px; }

.empty-state {
  grid-column: 1 / -1;
  padding: 56px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  color: var(--muted);
  text-align: center;
}

/* ===== Lesson deck ===== */

body.lesson-page {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.lesson-app {
  display: grid;
  grid-template-rows: 58px minmax(0, 1fr) 58px;
  width: 100%;
  height: 100vh;
  height: 100dvh;
}

.lesson-topbar {
  position: relative;
  z-index: 20;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(13, 17, 23, 0.88);
  backdrop-filter: blur(18px);
}

body[data-theme="av"] .lesson-topbar { background: rgba(18, 16, 15, 0.9); }

.lesson-ident {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 14px;
}

.lesson-ident .uc-short {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.lesson-ident .lesson-short {
  max-width: min(52vw, 680px);
  overflow: hidden;
  color: var(--paper-soft);
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-actions,
.deck-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-btn,
.deck-btn {
  display: inline-flex;
  min-height: 40px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--paper-soft);
  background: rgba(255, 255, 255, 0.035);
  cursor: pointer;
  transition: color 150ms ease, border-color 150ms ease, background 150ms ease, transform 150ms ease;
}

.tool-btn:hover,
.tool-btn:focus-visible,
.deck-btn:hover,
.deck-btn:focus-visible {
  border-color: rgba(var(--accent-rgb), 0.48);
  color: var(--paper);
  background: rgba(var(--accent-rgb), 0.09);
  outline: none;
}

.tool-btn:active,
.deck-btn:active { transform: scale(0.96); }
.tool-btn.is-active { color: var(--ink); border-color: var(--accent); background: var(--accent); }
.tool-btn .key { color: var(--muted); font-family: var(--mono); font-size: 10px; }
.tool-btn.is-active .key { color: rgba(13, 17, 23, 0.65); }

.deck-stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
}

.deck-track { height: 100%; }

.kit-slide {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(18px);
  transition: opacity 220ms ease, transform 220ms ease;
}

.kit-slide.is-active {
  z-index: 2;
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}

.kit-slide-main {
  display: flex;
  min-width: 0;
  flex-direction: column;
  justify-content: safe center;
  padding: clamp(30px, 5vh, 68px) clamp(34px, 5vw, 78px);
  overflow: auto;
}

.kit-slide-main > * { width: min(100%, 1120px); margin-right: auto; margin-left: auto; }

.kit-slide h1,
.kit-slide h2 {
  margin: 0;
  font-family: var(--display);
  letter-spacing: -0.035em;
  text-wrap: balance;
}

.kit-slide h1 { max-width: 1050px; font-size: clamp(52px, 7vw, 96px); line-height: 0.96; }
.kit-slide h2 { max-width: 920px; font-size: clamp(38px, 5vw, 66px); line-height: 1.02; }

.slide-lede {
  max-width: 900px;
  margin-top: 22px;
  color: var(--paper-soft);
  font-size: clamp(18px, 2vw, 24px);
  line-height: 1.55;
  text-wrap: pretty;
}

.title-rule {
  width: 90px;
  height: 5px;
  margin: 30px 0 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.cover-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 32px;
}

.meta-chip,
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--paper-soft);
  background: rgba(255, 255, 255, 0.035);
  font-size: 12px;
}

.meta-chip strong { color: var(--paper); }

.teacher-panel {
  position: relative;
  z-index: 4;
  display: flex;
  min-width: 0;
  flex-direction: column;
  padding: 28px 24px;
  overflow: auto;
  border-left: 1px solid rgba(var(--accent-rgb), 0.22);
  background:
    linear-gradient(180deg, rgba(var(--accent-rgb), 0.1), transparent 35%),
    var(--ink-soft);
}

.teacher-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.teacher-label {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.teacher-panel h3 {
  margin: 0 0 8px;
  color: var(--paper);
  font-size: 15px;
}

.teacher-note {
  margin: 0 0 20px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--paper-soft);
  background: rgba(255, 255, 255, 0.035);
  font-size: 13px;
  line-height: 1.55;
  text-wrap: pretty;
}

.teacher-note.is-speech {
  border-color: rgba(var(--accent-rgb), 0.3);
  color: var(--paper);
  background: rgba(var(--accent-rgb), 0.075);
}

.teacher-note ol,
.teacher-note ul { margin: 8px 0 0; padding-left: 19px; }
.teacher-note li + li { margin-top: 6px; }

.projection-mode .kit-slide { grid-template-columns: 1fr; }
.projection-mode .teacher-panel { display: none; }
.projection-mode .kit-slide-main { padding-right: clamp(34px, 7vw, 110px); padding-left: clamp(34px, 7vw, 110px); }

.cards-2,
.cards-3,
.cards-4 {
  display: grid;
  gap: 14px;
  margin-top: 30px;
}

.cards-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.content-card {
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.content-card strong,
.content-card h3 {
  display: block;
  margin: 0 0 8px;
  color: var(--paper);
  font-size: 17px;
}

.content-card p {
  margin: 0;
  color: var(--paper-soft);
  font-size: 14px;
  line-height: 1.52;
}

.presentation-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
  margin-top: 28px;
}

.presentation-card {
  min-height: 142px;
  background:
    linear-gradient(145deg, rgba(var(--accent-rgb), 0.075), transparent 72%),
    var(--panel);
}

.kit-slide.is-dense-cards .kit-slide-main {
  justify-content: safe center;
  padding-top: clamp(16px, 2.5vh, 24px);
  padding-bottom: clamp(16px, 2.5vh, 24px);
}

.kit-slide.is-dense-cards .slide-kicker {
  margin-bottom: 6px;
  font-size: 12px;
}

.kit-slide.is-dense-cards h2 {
  max-width: none;
  font-size: clamp(30px, 3.3vw, 46px);
  line-height: 1;
}

.kit-slide.is-dense-cards .slide-lede {
  max-width: none;
  margin-top: 8px;
  font-size: clamp(14px, 1.5vw, 18px);
  line-height: 1.3;
}

.presentation-card-grid.is-dense {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 12px;
}

/* A grade tem quatro colunas. Com dois, três ou seis cartões isso deixava
   uma coluna vazia à direita; aqui ela se ajusta à quantidade. Fica acima do
   ponto de quebra porque essas regras têm especificidade maior que a de tela
   estreita e manteriam várias colunas no celular. */
@media (min-width: 821px) {
  .presentation-card-grid.is-dense:has(> :last-child:nth-child(2)) {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .presentation-card-grid.is-dense:has(> :last-child:nth-child(3)),
  .presentation-card-grid.is-dense:has(> :last-child:nth-child(5)),
  .presentation-card-grid.is-dense:has(> :last-child:nth-child(6)) {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.presentation-card-grid.is-dense .presentation-card {
  min-height: 104px;
  padding: 12px 14px;
}

.presentation-card-grid.is-dense .card-index { margin-bottom: 6px; font-size: 12px; }
.presentation-card-grid.is-dense .content-card strong { margin-bottom: 5px; font-size: 15px; }
.presentation-card-grid.is-dense .content-card p { font-size: 12.5px; line-height: 1.3; }

.kit-slide.is-dense-cards .presentation-prompt {
  margin-top: 10px;
  padding: 10px 14px;
}

.kit-slide.is-dense-cards .presentation-prompt .card-index { display: none; }
.kit-slide.is-dense-cards .presentation-prompt strong { font-size: clamp(16px, 1.65vw, 21px); }

.kit-slide.is-dense-cards .presentation-bullets {
  gap: 6px;
  margin-top: 14px;
}

.kit-slide.is-dense-cards .presentation-bullets li {
  padding: 8px 12px 8px 34px;
  font-size: clamp(13px, 1.25vw, 16px);
  line-height: 1.3;
}

.kit-slide.is-dense-cards .presentation-bullets li::before {
  top: 12px;
  left: 15px;
  width: 7px;
  height: 7px;
}

.kit-slide.is-dense-cards .student-resource-link {
  margin-top: 10px;
  padding: 7px 10px;
}

.projection-mode .kit-slide.is-dense-cards .slide-kicker {
  margin-bottom: 8px;
  font-size: 13px;
}

.projection-mode .kit-slide.is-dense-cards h2 { font-size: clamp(36px, 4vw, 58px); }

.projection-mode .kit-slide.is-dense-cards .slide-lede {
  margin-top: 12px;
  font-size: clamp(16px, 1.7vw, 21px);
  line-height: 1.35;
}

.projection-mode .presentation-card-grid.is-dense {
  gap: 12px;
  margin-top: 18px;
}

.projection-mode .presentation-card-grid.is-dense .presentation-card {
  min-height: 128px;
  padding: 16px 18px;
}

.projection-mode .presentation-card-grid.is-dense .card-index { margin-bottom: 8px; font-size: 13px; }
.projection-mode .presentation-card-grid.is-dense .content-card strong { margin-bottom: 6px; font-size: 18px; }
.projection-mode .presentation-card-grid.is-dense .content-card p { font-size: 14px; line-height: 1.38; }

.projection-mode .kit-slide.is-dense-cards .presentation-prompt {
  margin-top: 14px;
  padding: 14px 18px;
}

.projection-mode .kit-slide.is-dense-cards .presentation-prompt strong { font-size: clamp(20px, 1.8vw, 25px); }

@media (max-aspect-ratio: 3 / 2) {
  .projection-mode .kit-slide.is-dense-cards h2 { font-size: clamp(32px, 3.6vw, 50px); }

  .projection-mode .kit-slide.is-dense-cards .slide-lede {
    margin-top: 10px;
    line-height: 1.3;
  }

  .projection-mode .presentation-card-grid.is-dense {
    gap: 9px;
    margin-top: 12px;
  }

  .projection-mode .presentation-card-grid.is-dense .presentation-card {
    min-height: 0;
    padding: 12px 14px;
  }

  .projection-mode .kit-slide.is-dense-cards .presentation-bullets { margin-top: 10px; }
  .projection-mode .kit-slide.is-dense-cards .presentation-bullets li { padding: 7px 12px 7px 32px; }
  .projection-mode .kit-slide.is-dense-cards .presentation-bullets li::before { top: 11px; }
  .projection-mode .kit-slide.is-dense-cards .presentation-prompt { margin-top: 10px; padding: 11px 16px; }

  .projection-mode .presentation-card-grid.is-dense .card-index { margin-bottom: 6px; }
  .projection-mode .presentation-card-grid.is-dense .content-card strong { margin-bottom: 4px; }
  .projection-mode .presentation-card-grid.is-dense .content-card p { line-height: 1.32; }
  .projection-mode .kit-slide.is-dense-cards .presentation-bullets { gap: 5px; }

  /* Mesmo aperto para os slides de layout padrão, que em 4:3 empurravam
     parte do conteúdo para fora da tela. */
  .projection-mode .kit-slide h2 { font-size: clamp(34px, 4.4vw, 56px); }
  .projection-mode .kit-slide .slide-lede { margin-top: 16px; line-height: 1.4; }
  .projection-mode .kit-slide .cards-2,
  .projection-mode .kit-slide .cards-3,
  .projection-mode .kit-slide .cards-4 { gap: 10px; margin-top: 18px; }
  .projection-mode .kit-slide .content-card { padding: 14px; }
  .projection-mode .kit-slide .block-focus { gap: 20px; margin-top: 20px; }
  .projection-mode .kit-slide .block-time { padding: 14px; }
  .projection-mode .kit-slide .block-directions { margin-top: 14px; }
  .projection-mode .kit-slide .presentation-bullets { margin-top: 16px; gap: 7px; }

  .projection-mode .kit-slide .block-step-list li {
    min-height: 0;
    padding-top: 8px;
    padding-bottom: 7px;
  }

  .projection-mode .kit-slide .block-step-list li::before { top: 8px; }

  /* A barra superior quebrava em duas linhas nessa largura e roubava altura
     de todos os slides. */
  .tool-btn,
  .deck-btn { min-height: 36px; padding: 0 10px; }
}

/* Projetor 4:3 e 5:4: quatro cartões em duas colunas, bloco mais estreito
   e centralizado, sem coluna vazia nem faixas estreitas demais. */
@media (max-aspect-ratio: 4 / 3) {
  .projection-mode .kit-slide-main > * { width: min(100%, 980px); }

  .projection-mode .presentation-card-grid.is-dense:has(> :last-child:nth-child(4)) {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .projection-mode .kit-slide.is-dense-cards h2 {
    font-size: clamp(28px, 3.2vw, 40px);
  }

  .projection-mode .kit-slide.is-dense-cards .slide-lede {
    margin-top: 8px;
    font-size: clamp(15px, 1.55vw, 18px);
  }

  .projection-mode .presentation-card-grid.is-dense {
    gap: 10px;
    margin-top: 12px;
  }

  .projection-mode .presentation-card-grid.is-dense .presentation-card {
    min-height: 0;
    padding: 12px 14px;
  }
}

@media (max-aspect-ratio: 5 / 4) {
  .projection-mode .kit-slide-main > * { width: min(100%, 920px); }

  .projection-mode .kit-slide.is-dense-cards h2 {
    font-size: clamp(26px, 3vw, 36px);
    line-height: 1.05;
  }

  .projection-mode .kit-slide.is-dense-cards .slide-lede {
    margin-top: 6px;
    line-height: 1.28;
  }

  .projection-mode .presentation-card-grid.is-dense {
    gap: 8px;
    margin-top: 10px;
  }

  .projection-mode .kit-slide.is-dense-cards .presentation-bullets { margin-top: 8px; }
  .projection-mode .kit-slide.is-dense-cards .presentation-prompt { margin-top: 8px; padding: 10px 14px; }
}

.presentation-bullets {
  display: grid;
  gap: 10px;
  margin: 26px auto 0;
  padding: 0;
  list-style: none;
}

.presentation-bullets li {
  position: relative;
  padding: 13px 16px 13px 42px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--paper-soft);
  background: rgba(255, 255, 255, 0.03);
  font-size: clamp(15px, 1.6vw, 19px);
  line-height: 1.45;
}

.presentation-bullets li::before {
  position: absolute;
  top: 17px;
  left: 18px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px rgba(var(--accent-rgb), 0.11);
  content: "";
}

.presentation-prompt {
  margin-top: 24px;
  padding: 18px 22px;
  border: 1px solid rgba(var(--accent-rgb), 0.42);
  border-radius: var(--radius);
  background: rgba(var(--accent-rgb), 0.09);
}

.presentation-prompt .card-index { margin-bottom: 7px; }

.presentation-prompt strong {
  display: block;
  color: var(--paper);
  font-family: var(--display);
  font-size: clamp(20px, 2.4vw, 31px);
  line-height: 1.2;
  text-wrap: balance;
}

.card-index {
  display: block;
  margin-bottom: 14px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 800;
}

.schedule-card {
  position: relative;
  min-height: 170px;
  overflow: hidden;
}

.schedule-card time {
  display: block;
  margin-bottom: 14px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.schedule-card p {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 4;
}

.block-focus {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr);
  gap: 28px;
  align-items: start;
  margin-top: 34px;
}

.block-time {
  padding: 20px;
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  border-radius: var(--radius);
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.075);
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 800;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.block-activity {
  margin: 0;
  color: var(--paper-soft);
  font-size: clamp(18px, 2.1vw, 26px);
  line-height: 1.55;
}

.block-activity.is-compact {
  font-size: clamp(15px, 1.55vw, 20px);
  line-height: 1.45;
}

.block-title,
.student-sheet-title {
  font-weight: 600;
  letter-spacing: -0.02em;
}

.block-title {
  font-size: clamp(36px, 4.2vw, 58px) !important;
}

.student-sheet-title {
  font-size: clamp(36px, 4.4vw, 60px) !important;
}

.review-title {
  font-weight: 600;
  letter-spacing: -0.02em;
}

.review-deliverable {
  max-width: 900px;
  margin: 24px 0 0;
  color: var(--paper-soft);
  font-size: 18px;
  line-height: 1.5;
  text-wrap: pretty;
}

.review-deliverable strong {
  color: var(--paper);
  font-weight: 650;
}

.block-directions {
  margin-top: 20px;
}

.block-directions .card-index {
  margin-bottom: 10px;
  font-weight: 600;
}

.block-step-list,
.student-sheet-list {
  display: grid;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: compact-steps;
}

.block-step-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 26px;
  border-top: 1px solid var(--line);
}

.block-step-list li {
  position: relative;
  min-height: 46px;
  padding: 11px 0 10px 34px;
  border-bottom: 1px solid var(--line);
  color: var(--paper-soft);
  font-size: 13px;
  line-height: 1.38;
  text-wrap: pretty;
  counter-increment: compact-steps;
}

.block-step-list li::before {
  position: absolute;
  top: 11px;
  left: 3px;
  color: var(--accent);
  content: counter(compact-steps, decimal-leading-zero);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
}

.student-sheet-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  margin-top: 24px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.student-sheet-section {
  padding: 18px 22px 18px 0;
}

.student-sheet-section + .student-sheet-section {
  padding-left: 22px;
  border-left: 1px solid var(--line);
}

.student-sheet-section .card-index {
  margin-bottom: 10px;
  font-weight: 600;
  letter-spacing: 0.025em;
}

.student-sheet-list {
  gap: 7px;
}

.student-sheet-list li {
  position: relative;
  padding-left: 18px;
  color: var(--paper-soft);
  font-size: 13px;
  line-height: 1.4;
  text-wrap: pretty;
}

.student-sheet-list li::before {
  position: absolute;
  top: 0.55em;
  left: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
}

.student-resource-link {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  margin-top: 18px;
  padding: 11px 14px;
  border: 1px solid rgba(var(--accent-rgb), 0.38);
  border-radius: 9px;
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.07);
  font-size: 13px;
  font-weight: 650;
}

.student-resource-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.student-resource-link:hover,
.student-resource-link:focus-visible {
  border-color: var(--accent);
  color: var(--paper);
  outline: none;
}

.extension-callout {
  margin: 14px 0 0;
  padding: 11px 14px;
  border-left: 3px solid var(--accent-2);
  color: var(--paper-soft);
  background: transparent;
  font-size: 13px;
  line-height: 1.45;
  text-wrap: pretty;
}

.extension-callout strong {
  color: var(--paper);
}

.step-list,
.check-list,
.problem-list {
  display: grid;
  gap: 12px;
  margin: 30px 0 0;
  padding: 0;
  list-style: none;
}

.step-list { grid-template-columns: repeat(2, minmax(0, 1fr)); counter-reset: steps; }

.step-list li {
  position: relative;
  min-height: 92px;
  padding: 18px 18px 18px 54px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--paper-soft);
  background: var(--panel);
  font-size: 15px;
  line-height: 1.48;
  counter-increment: steps;
}

.step-list li::before {
  position: absolute;
  top: 17px;
  left: 16px;
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border-radius: 50%;
  color: var(--ink);
  background: var(--accent);
  content: counter(steps);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 900;
}

.check-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.check-list li {
  position: relative;
  padding: 15px 16px 15px 46px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--paper-soft);
  background: var(--panel);
  font-size: 14px;
  line-height: 1.45;
}

.check-list li::before {
  position: absolute;
  top: 13px;
  left: 15px;
  color: var(--success);
  content: "✓";
  font-size: 20px;
  font-weight: 900;
}

.formative-check-list {
  gap: 0 26px;
  border-top: 1px solid var(--line);
}

.formative-check-list li {
  padding: 14px 8px 13px 32px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  text-wrap: pretty;
}

.formative-check-list li::before {
  top: 12px;
  left: 5px;
  font-size: 17px;
  font-weight: 600;
}

.code-stack {
  display: grid;
  gap: 14px;
  margin-top: 26px;
}

.code-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #080b0f;
  box-shadow: var(--shadow);
}

.code-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px 10px 16px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  background: rgba(255, 255, 255, 0.04);
  font-family: var(--mono);
  font-size: 11px;
}

.copy-btn {
  min-width: 40px;
  min-height: 40px;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--paper-soft);
  background: transparent;
  cursor: pointer;
}

.copy-btn:hover,
.copy-btn:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

.code-card pre {
  max-height: 260px;
  margin: 0;
  padding: 18px;
  overflow: auto;
  color: #d6e5f2;
  font-family: var(--mono);
  font-size: clamp(12px, 1.2vw, 15px);
  line-height: 1.58;
  tab-size: 2;
  white-space: pre;
}

.problem-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.problem-list li {
  padding: 18px;
  border: 1px solid rgba(255, 122, 117, 0.22);
  border-radius: 12px;
  background: rgba(255, 122, 117, 0.055);
}

.problem-list strong {
  display: block;
  margin-bottom: 7px;
  color: var(--danger);
  font-size: 14px;
}

.problem-list span {
  color: var(--paper-soft);
  font-size: 14px;
  line-height: 1.45;
}

.fallback-box {
  margin-top: 20px;
  padding: 20px 22px;
  border-left: 4px solid var(--warning);
  border-radius: 0 12px 12px 0;
  color: var(--paper-soft);
  background: rgba(255, 200, 107, 0.075);
  font-size: 16px;
  line-height: 1.55;
}

.fallback-box strong { color: var(--warning); }

.deck-bottombar {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  padding: 0 22px;
  border-top: 1px solid var(--line);
  background: rgba(13, 17, 23, 0.94);
}

body[data-theme="av"] .deck-bottombar { background: rgba(18, 16, 15, 0.96); }

.deck-progress {
  position: absolute;
  top: -1px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 220ms ease;
}

.deck-counter {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.deck-center {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.course-pace-dot {
  width: 12px;
  height: 12px;
  flex: 0 0 12px;
  border-radius: 50%;
  background: #7cc49a;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.42),
    0 0 0 5px rgba(124, 196, 154, 0.12),
    0 4px 12px rgba(0, 0, 0, 0.38);
  transition: background 200ms ease, box-shadow 200ms ease, transform 200ms ease;
}

.course-pace-dot.is-ok {
  background: #7cc49a;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.42),
    0 0 0 5px rgba(124, 196, 154, 0.12),
    0 4px 12px rgba(0, 0, 0, 0.38);
}

.course-pace-dot.is-warn {
  background: #e7b66e;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.42),
    0 0 0 5px rgba(231, 182, 110, 0.18),
    0 4px 12px rgba(0, 0, 0, 0.38);
}

.course-pace-dot.is-err {
  background: #d98a8a;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.42),
    0 0 0 5px rgba(217, 138, 138, 0.2),
    0 4px 12px rgba(0, 0, 0, 0.38);
  animation: coursePacePulse 1.2s ease-in-out infinite;
}

.course-pace-dot:hover {
  transform: scale(1.25);
}

@keyframes coursePacePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.deck-actions:last-child { justify-content: flex-end; }
.deck-btn[disabled] { opacity: 0.28; cursor: not-allowed; }

.slide-overview {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: none;
  padding: 34px;
  overflow: auto;
  background: rgba(5, 7, 10, 0.96);
  backdrop-filter: blur(18px);
}

.slide-overview.is-open { display: block; }

.overview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 1180px);
  margin: 0 auto 24px;
}

.overview-head h2 { margin: 0; font-family: var(--display); font-size: 34px; }

.overview-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  width: min(100%, 1180px);
  margin: 0 auto;
}

.overview-card {
  min-height: 150px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--paper);
  background: var(--panel);
  text-align: left;
  cursor: pointer;
}

.overview-card:hover,
.overview-card:focus-visible { border-color: var(--accent); outline: none; }
.overview-card.is-current { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.08); }
.overview-card span { display: block; margin-bottom: 12px; color: var(--accent); font-family: var(--mono); font-size: 11px; }
.overview-card strong { font-family: var(--display); font-size: 20px; line-height: 1.18; }

.toast {
  position: fixed;
  right: 24px;
  bottom: 78px;
  z-index: 100;
  padding: 11px 15px;
  border: 1px solid rgba(var(--accent-rgb), 0.35);
  border-radius: 9px;
  opacity: 0;
  color: var(--paper);
  background: var(--ink-soft);
  box-shadow: var(--shadow);
  font-size: 13px;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 160ms ease, transform 160ms ease;
}

.toast.is-visible { opacity: 1; transform: translateY(0); }

.error-screen {
  display: grid;
  min-height: 100vh;
  min-height: 100dvh;
  place-items: center;
  padding: 30px;
}

.error-card {
  max-width: 620px;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.error-card h1 { margin: 0 0 12px; font-family: var(--display); }
.error-card p { color: var(--paper-soft); line-height: 1.6; }

@media (max-width: 1080px) {
  .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lab-tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lab-flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kit-slide { grid-template-columns: minmax(0, 1fr) 320px; }
  .cards-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 820px) {
  .course-shell { width: min(100% - 26px, 1320px); }
  .course-hero { grid-template-columns: 1fr; padding-top: 48px; }

</style></head><body class="lesson-page"><div id="lessonRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>window.SENAI_COURSES={"design-web":{"slug":"design-web","code":"UC · Design Web","title":"Design Web","workload":"100 h","lessonCount":29,"module":"Módulo Específico II","teacher":"Daniel Marcos Mayer","period":"2026/2","theme":"web","description":"Comunicação visual, interfaces, prototipação, mídias sociais, acessibilidade e projeto de presença digital, sem programação discente.","sourceLabel":"Planejamento_Geral_UC_Design_Web.md","lessons":[{"num":"16","title":"Ideias que viram direção","description":"Uma oficina de soluções de software: transformar um pedido do Festival Vira-Luz em seis alternativas, conceito e três esboços de página de início mais uma página interna que outra pessoa consegue testar.","objectives":["Desenvolvimento do Projeto: ideação, conceituação, rafes.","Inovação: visão inovadora."],"technical":["Selecionar a criação de elementos gráficos para o desenvolvimento de design web, interfaces e redes sociais, tendo vista a propriedade."],"socioemotional":["Demonstrar espírito colaborativo em atividades coletivas.","Aplicar os aspectos de inovação em suas atividades profissionais."],"schedule":[{"horario":"19:00 - 19:45","atividade":"Ler a situação-problema, fazer o diagnóstico de duas soluções e gerar seis alternativas de primeira tela para o Festival Vira-Luz. Comparar alternativas pela tarefa que ajudam a realizar."},{"horario":"20:05 - 20:45","atividade":"Selecionar três alternativas promissoras, definir o conceito da solução e usar três critérios para justificar a escolha. Alternar quem opera e iniciar os esboços de página."},{"horario":"20:45 - 21:30","atividade":"Montar na oficina três esboços de página de baixa fidelidade para a página inicial e uma página interna da direção escolhida. Organizar blocos, título, ação e conteúdo prioritário. Entre 21h15 e 21h30, realizar a visita de uma pessoa de outra dupla, sem explicação dos autores."},{"horario":"21:30 - 22:00","atividade":"Concluir o registro da visita já realizada, revisar a direção, responder aos registros individuais A/B e participar da síntese final. Das 22:00 às 22:30: clínica e apoio técnico opcional, sem conteúdo ou avaliação nova."}],"methodology":"Situação-problema profissional inteiramente praticada na oficina: diagnóstico por comparação, ideação divergente e seleção convergente, construção de esboços de página, teste por observação e revisão baseada em evidência. Os 160 minutos letivos priorizam decisões e ações do estudante; a fala demonstrativa do docente soma no máximo 12 minutos, distribuída em intervenções de até dois minutos. A dupla alterna autoria e observação; cada estudante registra sua autoavaliação.","resources":"Projetor, navegador e Estúdio de Direções da Aula 16. A oficina local reúne o briefing, as alternativas, a criação, o teste, os critérios e o rascunho. Sem login, instalação, impressão, pesquisa externa ou envio obrigatório.","observation":"19:00–22:00 de conteúdo e evidência avaliável, com intervalo 19:45–20:05. Das 22:00 às 22:30 é somente apoio técnico individual, salvamento e organização do trabalho já concluído; não apresenta conteúdo novo nem cria exigência para quem saiu. Chamada no início dos quatro blocos. Os casos são fictícios; uma dupla por computador; rascunho fica neste navegador."}]}};window.SENAI_TEACHING_SUPPORT={"design-web":{"courseTips":{"promise":"Em cada aula, uso explicação de 10 a 15 minutos, modelo visual, prática em duplas ou equipes, produto visível na mesma noite, critérios de conferência e plano B sem internet.","routine":["Antes da turma entrar, deixo abertas as referências, a ferramenta visual e a pasta de entrega.","Apresento o objetivo e mostro um exemplo pronto sem transformar a demonstração em aula de programação.","Divido a produção em passos curtos, com papéis claros e uma verificação intermediária.","Encerro com teste entre pares, registr window.SENAI_SLIDE_PACE = function ({now, start, end, lessonStart, lessonEnd, isBreak, isLast}) {
  const clock = value => `${String(Math.floor(value / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
  if (now < lessonStart) return {level:'ok',message:`Aula começa às ${clock(lessonStart)}`};
  if (now >= lessonEnd) return {level:isLast ? 'ok' : 'err',message:isLast ? `Encerramento · ${clock(lessonEnd)}` : `Horário encerrado · finalizar até ${clock(lessonEnd)}`};
  if (isBreak && now >= start && now < end) return {level:'ok',message:`Intervalo no horário · retorno ${clock(end)}`};
  if (now < start - 2) return {level:'warn',message:`Adiantado ${Math.ceil(start - now)} min · etapa prevista ${clock(start)}–${clock(end)}`};
  if (now >= end + 2) return {level:'err',message:`Atrasado ${Math.floor(now - end)} min · etapa prevista até ${clock(end)}`};
  return {level:'ok',message:`No ritmo · etapa prevista ${clock(start)}–${clock(end)}`};
};

  const ownVoice = (value = '') => {
    let text = String(value)
      .trim()
      .replace(/\bO professor fica\b/g, 'Fico')
      .replace(/\bo professor fica\b/g, 'fico');

    const ambiguousNouns = new Set(['controle', 'destaque', 'escolha', 'limite', 'peça', 'recorte', 'teste']);
    const sources = Object.keys(firstPersonVerbs).join('|');
    const coordinatedSources = Object.keys(firstPersonVerbs)
      .filter((verb) => !ambiguousNouns.has(verb))
      .join('|');
    const replaceVerb = (match) => {
      const replacement = firstPersonVerbs[match.toLocaleLowerCase('pt-BR')];
      return match[0] === match[0].toLocaleUpperCase('pt-BR')
        ? replacement[0].toLocaleUpperCase('pt-BR') + replacement.slice(1)
        : replacement;
    };
    const replaceInContext = (pattern) => {
      text = text.replace(pattern, (...parts) => {
        const verb = parts.at(-3);
        return parts.slice(1, -3).join('') + replaceVerb(verb);
      });
    };

    replaceInContext(new RegExp(`^(\\s*)(${sources})(?![\\p{L}\\p{N}_])`, 'iu'));
    replaceInContext(new RegExp(`([.;:!?—–]\\s+)([“"'(]?\\s*)(${sources})(?![\\p{L}\\p{N}_])`, 'giu'));
    replaceInContext(new RegExp(
      `^((?:Sem|Se|No|Na|Nos|Nas|Dentro|Antes|Após|Primeiro|Em|Ao|Para)\\b[^,;.!?]{0,120},\\s*)(${sources})(?![\\p{L}\\p{N}_])`,
      'iu'
    ));
    replaceInContext(new RegExp(`(\\s+e\\s+)(${coordinatedSources})(?![\\p{L}\\p{N}_])`, 'giu'));
    replaceInContext(new RegExp(`(,\\s+)(${coordinatedSources})(?![\\p{L}\\p{N}_])`, 'giu'));
    text = text
      .replace(/\be destaque (?=(?:o|a|os|as|um|uma|entregáveis)\b)/giu, 'e destaco ')
      .replace(/\be peça (?=(?:que|confirmação|pensamento)\b)/giu, 'e peço ')
      .replace(/\be teste (?=(?:novamente|em|no|na|com|o|a)\b)/giu, 'e testo ');

    return text;
  };

      ${review.intro ? `<p class="slide-lede">${escapeHtml(review.intro)}</p>` : ''}
      ${review.title
        ? `<p class="review-deliverable"><strong>Entrega:</strong> ${escapeHtml(support.studentDeliverable)}</p>`
        : `<p class="slide-lede"><strong>${escapeHtml(support.studentDeliverable)}</strong></p>`}
      ${listHtml(support.check, review.title ? 'check-list formative-check-list' : 'check-list')}`,
    teacher: {
      steps: review.teacherSteps || [
        'Projeto os critérios antes do fim da atividade.',
        'Reservo uma autoavaliação breve.',
        'Confiro o arquivo, o registro ou a demonstração correspondente.',
        'Anoto as retomadas necessárias para a aula seguinte.',
        ...commonProblems.slice(0, 3).map(([problem, fix]) => `${problem}: ${ownVoice(fix)}`)
      ],
      watch: support.check[0] || support.studentDeliverable,
      rescue: ownVoice(support.fallback)
    }
  }));

  }

  if (support.appendDefaultClosing !== false) slides.push(slide({
    title: 'Fechamento da aula',
    block: lesson.schedule.length,
    main: `
      <p class="slide-kicker">Bilhete de saída</p>
      <h2>O que ficou pronto hoje?</h2>
      <p class="slide-lede">${escapeHtml(support.studentDeliverable)}</p>
      <div class="cards-2">
        <article class="content-card">
          <span class="card-index">Responda em uma frase</span>
          <strong>O que você aprendeu a fazer?</strong>
          <p>Use um verbo: criar, analisar, aplicar, testar, publicar, gravar ou editar.</p>
        </article>
        <article class="content-card">
          <span class="card-index">${nextLesson ? 'Próxima aula' : 'Encerramento da UC'}</span>
          <strong>${escapeHtml(nextLesson ? `Aula ${nextLesson.num} · ${nextLesson.title}` : 'Mostra, reflexão e próximos passos')}</strong>
          <p>${escapeHtml(nextLesson ? nextLesson.description : 'Guarde as evidências e registre o que faria em uma próxima versão.')}</p>
        </article>
      </div>`,
    teacher: {
      steps: [
        'Interrompo a atividade cinco minutos antes do final.',
        'Confiro o salvamento e a cópia da entrega.',
        'Ouço duas ou três respostas.',
        nextLesson ? `Anteciparei apenas o material necessário para a Aula ${nextLesson.num}.` : 'Conduzo uma retrospectiva breve da UC.'
      ],
      watch: support.check.at(-1) || support.studentDeliverable,
      rescue: 'Sem tempo para socialização oral, recolho a frase em papel ou formulário.'
    }
  }));

  const root = document.getElementById('lessonRoot');
  root.innerHTML = `
    <div class="lesson-app projection-mode" id="lessonApp">
      <header class="lesson-topbar">
        <div class="lesson-ident">
          <a class="back-link" href="index.html" aria-label="Voltar à oficina de ${escapeHtml(course.title)}" title="Voltar à oficina (H)">← <span class="back-text">Oficina</span></a>
          <span class="uc-short">${escapeHtml(course.title)}</span>
          <span class="lesson-short">Aula ${lesson.num} · ${escapeHtml(lesson.title)}</span>
        </div>
        <div class="top-actions">
          <button class="tool-btn mode-btn" id="modeBtn" type="button" aria-pressed="false" title="Mostrar minhas anotações (P)">
            <span aria-hidden="true">▣</span><span class="button-label">Notas</span><span class="key">P</span>
          </button>
          <button class="tool-btn" id="gridBtn" type="button" title="Ver todos os slides (G)">
            <span aria-hidden="true">▦</span><span class="button-label">Grade</span><span class="key">G</span>
          </button>
          <button class="tool-btn" id="printBtn" type="button" title="Imprimir guia completo (D)">
            <span aria-hidden="true">↓</span><span class="button-label">PDF</span><span class="key">D</span>
          </button>
          <button class="tool-btn" id="fullscreenBtn" type="button" title="Tela cheia (F)">
            <span aria-hidden="true">⛶</span><span class="button-label">Tela cheia</span><span class="key">F</span>
          </button>
        </div>
      </header>

      <main class="deck-stage">
        <div class="deck-track">${slides.map((item) => item.html).join('')}</div>
      </main>

      <footer class="deck-bottombar">
        <div class="deck-progress" id="deckProgress"></div>
        <div class="deck-actions">
          <button class="deck-btn" id="prevBtn" type="button"><span aria-hidden="true">←</span><span class="button-label">Anterior</span></button>
          ${previousLesson ? `<a class="deck-btn" href="aula-kit.html?uc=${encodeURIComponent(courseSlug)}&aula=${previousLesson.num}" title="Aula anterior">Aula ${previousLesson.num}</a>` : ''}
        </div>
        <div class="deck-center">
          <span
            class="course-pace-dot is-ok"
            id="coursePaceDot"
            role="status"
            aria-live="polite"
            aria-label="Ritmo da aula: No ritmo"
            title="No ritmo"
          ></span>
          <div class="deck-counter" id="deckCounter" aria-live="polite"></div>
        </div>
        <div class="deck-actions">
          ${nextLesson ? `<a class="deck-btn" href="aula-kit.html?uc=${encodeURIComponent(courseSlug)}&aula=${nextLesson.num}" title="Próxima aula">Aula ${nextLesson.num}</a>` : ''}
          <button class="deck-btn" id="nextBtn" type="button"><span class="button-label">Próximo</span><span aria-hidden="true">→</span></button>
        </div>
      </footer>
    </div>

    <div class="slide-overview" id="slideOverview" role="dialog" aria-modal="true" aria-labelledby="overviewTitle" aria-hidden="true" inert>
      <div class="overview-head">
        <h2 id="overviewTitle">Mapa da aula</h2>
        <button class="tool-btn" id="closeOverview" type="button">Fechar · Esc</button>
      </div>
      <div class="overview-grid">
        ${slides.map((item, index) => `
          <button class="overview-card" type="button" data-go="${index}">
            <span>${String(index + 1).padStart(2, '0')}</span>
            <strong>${escapeHtml(item.title)}</strong>
          </button>`).join('')}
      </div>
    </div>`;

  const app = document.getElementById('lessonApp');
  const slideElements = [...document.querySelectorAll('.kit-slide')];
  const overview = document.getElementById('slideOverview');
  const counter = document.getElementById('deckCounter');
  const progress = document.getElementById('deckProgress');
  const prevButton = document.getElementById('prevBtn');
  const nextButton = document.getElementById('nextBtn');
  const modeButton = document.getElementById('modeBtn');
  const paceDot = document.getElementById('coursePaceDot');
  const toast = document.getElementById('toast');
  const scheduleWindows = lesson.schedule.map((block, index) => {
    const [start, end] = timeRange(block.horario);
    return {
      number: index + 1,
      label: `Bloco ${index + 1}`,
      start: timeToMinutes(start),
      end: timeToMinutes(end)
    };
  });
  let currentIndex = 0;
  let toastTimer;
  let overviewTrigger = null;

  function currentScheduleWindow(now = new Date()) {
    const minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const active = scheduleWindows.find((block) => minutes >= block.start && minutes < block.end);
    if (active) {
      return {
        block: active,
        progress: (minutes - active.start) / (active.end - active.start),
        status: 'active'
      };
    }
    if (minutes < scheduleWindows[0].start) {
      return { block: scheduleWindows[0], progress: 0, status: 'before' };
    }
    for (let index = 0; index < scheduleWindows.length - 1; index += 1) {
      const current = scheduleWindows[index];
      const next = scheduleWindows[index + 1];
      if (minutes >= current.end && minutes < next.start) {
        return {
          block: next,
          progress: (minutes - current.end) / Math.max(1, next.start - current.end),
          status: 'break'
        };
      }
    }
    return {
      block: scheduleWindows.at(-1),
      progress: 1,
      status: 'after'
    };
  }

  function paceHealth() {
    const activeSlide = slideElements[currentIndex];
    const slideBlock = Number(activeSlide?.dataset.block || 0);
    const expected = currentScheduleWindow();
    if (usesSlidePace && window.SENAI_SLIDE_PACE) {
      const now = new Date();
      const start = activeSlide?.dataset.paceStart === '' ? scheduleWindows[0].start : Number(activeSlide?.dataset.paceStart);
      const end = activeSlide?.dataset.paceEnd === '' ? scheduleWindows[0].start + 5 : Number(activeSlide?.dataset.paceEnd);
      return window.SENAI_SLIDE_PACE({now: now.getHours() * 60 + now.getMinutes(), start, end,
        lessonStart: scheduleWindows[0].start, lessonEnd: scheduleWindows.at(-1).end,
        isBreak: activeSlide?.dataset.pace === 'break', isLast: currentIndex === slideElements.length - 1});
    }
    if (!slideBlock || !expected) return { level: 'ok', message: 'No ritmo' };
    if (activeSlide?.dataset.pace === 'break' && expected.status === 'break') {
      return { level: 'ok', message: 'Intervalo no horário' };
    }
    if (expected.block.number < slideBlock) {
      return { level: 'warn', message: `Adiantado · slide é do Bloco ${slideBlock}` };
    }
    if (expected.block.number > slideBlock) {
      return { level: 'err', message: `Atrasado · slide é do Bloco ${slideBlock}` };
    }

    const slidesInBlock = slideElements.filter((element) => Number(element.dataset.block) === slideBlock);
    if (slidesInBlock.length <= 1) return { level: 'ok', message: 'No ritmo' };
    const position = slidesInBlock.indexOf(activeSlide);
    const expectedProgress = (position + 1) / slidesInBlock.length;
    const delta = expectedProgress - expected.progress;
    if (delta > 0.25) {
      return { level: 'warn', message: 'Adiantado no bloco · há tempo para aprofundar' };
    }
    if (delta < -0.25) {
      return { level: 'warn', message: 'Atrasado no bloco · priorize o essencial' };
    }
    return { level: 'ok', message: 'No ritmo' };
  }

  function renderPace() {
    if (!paceDot) return;
    const health = paceHealth();
    paceDot.classList.remove('is-ok', 'is-warn', 'is-err');
    paceDot.classList.add(`is-${health.level}`);
    paceDot.title = health.message;
    paceDot.setAttribute('aria-label', `Ritmo da aula: ${health.message}`);
    paceDot.dataset.state = health.level;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1600);
  }

  if (usesSlidePace && paceDot) {
    paceDot.tabIndex = 0;
    paceDot.addEventListener('click', () => showToast(paceDot.title));
    paceDot.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); showToast(paceDot.title); }
    });
  }

  function renderCurrent() {
    slideElements.forEach((element, index) => {
      element.classList.toggle('is-active', index === currentIndex);
      element.setAttribute('aria-hidden', index === currentIndex ? 'false' : 'true');
      element.inert = index !== currentIndex;
    });
    document.querySelectorAll('.overview-card').forEach((element, index) => {
      element.classList.toggle('is-current', index === currentIndex);
    });
    counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(slideElements.length).padStart(2, '0')}`;
    progress.style.width = `${((currentIndex + 1) / slideElements.length) * 100}%`;
    prevButton.disabled = currentIndex === 0;
    nextButton.disabled = currentIndex === slideElements.length - 1;
    document.title = `${slides[currentIndex].title} · ${course.title}`;
    renderPace();
  }

  function goTo(index) {
    slideElements[currentIndex].querySelectorAll('video').forEach(video => video.pause());
    currentIndex = Math.max(0, Math.min(slideElements.length - 1, index));
    renderCurrent();
  }

  function toggleProjection(force) {
    const on = typeof force === 'boolean' ? force : !app.classList.contains('projection-mode');
    app.classList.toggle('projection-mode', on);
    modeButton.classList.toggle('is-active', !on);
    modeButton.setAttribute('aria-pressed', String(!on));
    modeButton.querySelector('.button-label').textContent = on ? 'Notas' : 'Projetar';
    modeButton.title = on ? 'Mostrar minhas anotações (P)' : 'Ocultar anotações e projetar (P)';
    showToast(on ? 'Projeção: anotações ocultas' : 'Minhas anotações estão visíveis');
  }

  function toggleOverview(force) {
    const on = typeof force === 'boolean' ? force : !overview.classList.contains('is-open');
    if (on) overviewTrigger = document.activeElement;
    overview.classList.toggle('is-open', on);
    overview.setAttribute('aria-hidden', String(!on));
    overview.inert = !on;
    app.inert = on;
    if (on) {
      const current = overview.querySelector('.overview-card.is-current') || overview.querySelector('.overview-card');
      current.focus();
    } else if (overviewTrigger instanceof HTMLElement) {
      overviewTrigger.focus();
    }
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch {
      showToast('Tela cheia não disponível neste navegador');
    }
  }

  prevButton.addEventListener('click', () => goTo(currentIndex - 1));
  nextButton.addEventListener('click', () => goTo(currentIndex + 1));
  modeButton.addEventListener('click', () => toggleProjection());
  document.getElementById('gridBtn').addEventListener('click', () => toggleOverview());
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
  document.getElementById('closeOverview').addEventListener('click', () => toggleOverview(false));

  overview.addEventListener('click', (event) => {
    if (event.target === overview) toggleOverview(false);
    const button = event.target.closest('[data-go]');
    if (!button) return;
    goTo(Number(button.dataset.go));
    toggleOverview(false);
  });

  overview.addEventListener('keydown', (event) => {
    if (event.key !== 'Tab') return;
    const focusable = [...overview.querySelectorAll('button:not([disabled]), a[href]')];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable.at(-1);
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  document.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-copy]');
    if (!button) return;
    const snippet = support.code && support.code[Number(button.dataset.copy)];
    if (!snippet) return;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(snippet.content);
      } else {
        const helper = document.createElement('textarea');
        helper.value = snippet.content;
        helper.setAttribute('readonly', '');
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand('copy');
        helper.remove();
        if (!copied) throw new Error('copy unavailable');
      }
      button.textContent = 'Copiado';
      showToast('Código copiado');
      setTimeout(() => { button.textContent = 'Copiar'; }, 1200);
    } catch {
      showToast('Selecione o código e copie manualmente');
    }
  });

  if (isDesignSix) {
    const qrDialog = document.createElement('dialog');
    qrDialog.className = 'tool-qr-dialog';
    qrDialog.setAttribute('aria-labelledby', 'toolQrTitle');
    qrDialog.innerHTML = '<form method="dialog"><button autofocus aria-label="Fechar QR code">Fechar ×</button></form><h2 id="toolQrTitle"></h2><p>Aponte a câmera do celular</p><img width="370" height="370" alt=""><a target="_blank" rel="noopener"></a>';
    document.body.append(qrDialog);
    document.addEventListener('click', (event) => {
      const button = event.target.closest('.qr-open');
      if (!button) return;
      qrDialog.querySelector('h2').textContent = button.dataset.qrLabel;
      const image = qrDialog.querySelector('img');
      image.src = button.dataset.qr;
      image.alt = 'QR code para ' + button.dataset.qrLabel;
      const link = qrDialog.querySelector('a');
      link.href = button.dataset.qrUrl;
      link.textContent = button.dataset.qrUrl;
      qrDialog.showModal();
    });
  }

  // Native controls remain usable; only one teaching example plays at a time.
  document.querySelectorAll('.av11-media video').forEach(video => {
    video.addEventListener('play', () => {
      document.querySelectorAll('.av11-media video').forEach(other => {
        if (other !== video) other.pause();
      });
    });
  });

  document.addEventListener('keydown', (event) => {
    if (document.querySelector('.tool-qr-dialog[open]')) return;
    const target = event.target;
    if (target && /INPUT|TEXTAREA|SELECT|VIDEO/.test(target.tagName)) return;

    if (event.key === 'Escape' && overview.classList.contains('is-open')) {
      event.preventDefault();
      toggleOverview(false);
      return;
    }

    if (overview.classList.contains('is-open')) return;

    if (event.key === 'ArrowRight' || event.key === 'PageDown' || (event.key === ' ' && target === document.body)) {
      event.preventDefault();
      goTo(currentIndex + 1);
      return;
    }
    if (event.key === 'ArrowLeft' || event.key === 'PageUp' || event.key === 'Backspace') {
      event.preventDefault();
      goTo(currentIndex - 1);
      return;
    }
    if (event.key === 'Home') {
      event.preventDefault();
      goTo(0);
      return;
    }
    if (event.key === 'End') {
      event.preventDefault();
      goTo(slideElements.length - 1);
      return;
    }
    if (event.key === 'p' || event.key === 'P') {
      event.preventDefault();
      toggleProjection();
      return;
    }
    if (event.key === 'g' || event.key === 'G') {
      event.preventDefault();
      toggleOverview();
      return;
    }
    if (event.key === 'd' || event.key === 'D') {
      event.preventDefault();
      window.print();
      return;
    }
    if (event.key === 'f' || event.key === 'F') {
      event.preventDefault();
      toggleFullscreen();
      return;
    }
    if (event.key === 'h' || event.key === 'H') {
      event.preventDefault();
      window.location.href = `index.html`;
    }
  });

  if (isAvNine) {
    // The projected night map marks the block happening now, from the computer clock.
    const markCurrentBlock = () => {
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      document.querySelectorAll('.av9-day-row').forEach((row) => {
        row.classList.toggle('is-now', minutes >= Number(row.dataset.start) && minutes < Number(row.dataset.end));
      });
    };
    markCurrentBlock();
    window.setInterval(markCurrentBlock, 15000);

    // Voice-over window: one click puts a team on air; the previous team is marked as recorded.
    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-av9-team]');
      if (!button) return;
      const panel = button.closest('.av9-onair');
      const status = panel.querySelector('[data-av9-status]');
      const wasOnAir = button.classList.contains('is-on-air');
      panel.querySelectorAll('[data-av9-team].is-on-air').forEach((item) => {
        item.classList.remove('is-on-air');
        item.classList.add('is-done');
        item.setAttribute('aria-pressed', 'false');
      });
      if (!wasOnAir) {
        button.classList.remove('is-done');
        button.classList.add('is-on-air');
        button.setAttribute('aria-pressed', 'true');
      }
      panel.classList.toggle('is-live', !wasOnAir);
      const done = panel.querySelectorAll('[data-av9-team].is-done').length;
      status.textContent = wasOnAir
        ? `${button.dataset.av9Team} gravada · ${done} de 7 equipes`
        : `Gravando: ${button.dataset.av9Team} · silêncio na sala`;
      button.blur();
    });
  }

  renderCurrent();
  window.setInterval(renderPace, 1000);
})();
</script></body></html>
