<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Comparação de profundidade de campo</title>
  <desc id="desc">Dois quadros comparando fundo desfocado com fundo nítido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242424"/><stop offset="1" stop-color="#141414"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g transform="translate(56 56)">
    <rect width="470" height="350" rx="10" fill="#111" stroke="#ffffff" stroke-opacity=".1"/>
    <g filter="url(#blur)" opacity=".7">
      <circle cx="350" cy="88" r="38" fill="#C4A86C"/>
      <circle cx="398" cy="144" r="28" fill="#6B8CA8"/>
      <rect x="295" y="226" width="110" height="72" rx="8" fill="#C8C4BC"/>
      <rect x="64" y="70" width="128" height="216" rx="6" fill="#ffffff" opacity=".12"/>
    </g>
    <path d="M228 255c26-68 72-68 96 0" fill="none" stroke="#7CC49A" stroke-width="12" stroke-linecap="round"/>
    <rect x="236" y="252" width="88" height="76" rx="6" fill="#8B5E3C"/>
    <path d="M224 338h112" stroke="#C4A86C" stroke-width="6" stroke-linecap="round"/>
    <text x="28" y="44" fill="#C4A86C" font-family="SF Mono, Consolas, monospace" font-size="22">f/2.8</text>
    <text x="28" y="386" fill="#F0F0EC" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">profundidade rasa</text>
    <text x="28" y="419" fill="#C8C4BC" font-family="Segoe UI, system-ui, sans-serif" font-size="18">assunto separado, fundo vira textura</text>
  </g>
  <g transform="translate(574 56)">
    <rect width="470" height="350" rx="10" fill="#111" stroke="#ffffff" stroke-opacity=".1"/>
    <g opacity=".9">
      <circle cx="350" cy="88" r="38" fill="#C4A86C"/>
      <circle cx="398" cy="144" r="28" fill="#6B8CA8"/>
      <rect x="295" y="226" width="110" height="72" rx="8" fill="#C8C4BC"/>
      <rect x="64" y="70" width="128" height="216" rx="6" fill="#ffffff" opacity=".12"/>
    </g>
    <path d="M228 255c26-68 72-68 96 0" fill="none" stroke="#7CC49A" stroke-width="12" stroke-linecap="round"/>
    <rect x="236" y="252" width="88" height="76" rx="6" fill="#8B5E3C"/>
    <path d="M224 338h112" stroke="#C4A86C" stroke-width="6" stroke-linecap="round"/>
    <text x="28" y="44" fill="#C4A86C" font-family="SF Mono, Consolas, monospace" font-size="22">f/16</text>
    <text x="28" y="386" fill="#F0F0EC" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700">profundidade extensa</text>
    <text x="28" y="419" fill="#C8C4BC" font-family="Segoe UI, system-ui, sans-serif" font-size="18">assunto e contexto continuam legíveis</text>
  </g>
</svg>
