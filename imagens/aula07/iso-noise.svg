<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">ISO e ruído</title>
  <desc id="desc">Comparação técnica entre sinal limpo em ISO baixo e ruído em ISO alto.</desc>
  <defs>
    <pattern id="fine" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 13h26M13 0v26" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <pattern id="noise" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.6" fill="#fff" opacity=".34"/>
      <circle cx="12" cy="9" r="1.3" fill="#C4A86C" opacity=".34"/>
      <circle cx="8" cy="15" r="1.5" fill="#6B8CA8" opacity=".30"/>
      <circle cx="17" cy="3" r="1" fill="#D98A8A" opacity=".24"/>
    </pattern>
    <filter id="grainBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g transform="translate(74 60)">
    <text x="0" y="0" fill="#C4A86C" font-family="SF Mono, Consolas, monospace" font-size="25">ISO 100</text>
    <text x="0" y="42" fill="#F0F0EC" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="700">sinal limpo</text>
    <rect x="0" y="76" width="430" height="230" rx="10" fill="#161616" stroke="#fff" stroke-opacity=".10"/>
    <rect x="34" y="112" width="360" height="154" rx="8" fill="#23211d"/>
    <rect x="34" y="112" width="360" height="154" rx="8" fill="url(#fine)"/>
    <path d="M84 236c54-70 104-80 150-32 42 44 86 20 132-64" fill="none" stroke="#C4A86C" stroke-width="7" stroke-linecap="round"/>
    <circle cx="102" cy="220" r="8" fill="#7CC49A"/>
    <circle cx="238" cy="199" r="8" fill="#7CC49A"/>
    <circle cx="365" cy="142" r="8" fill="#7CC49A"/>
    <text x="0" y="350" fill="#C8C4BC" font-family="Segoe UI, system-ui, sans-serif" font-size="19">textura preservada, melhor gradação tonal</text>
  </g>
  <g transform="translate(596 60)">
    <text x="0" y="0" fill="#C4A86C" font-family="SF Mono, Consolas, monospace" font-size="25">ISO 6400</text>
    <text x="0" y="42" fill="#F0F0EC" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="700">sinal amplificado</text>
    <rect x="0" y="76" width="430" height="230" rx="10" fill="#161616" stroke="#fff" stroke-opacity=".10"/>
    <rect x="34" y="112" width="360" height="154" rx="8" fill="#23211d"/>
    <path d="M84 236c54-70 104-80 150-32 42 44 86 20 132-64" fill="none" stroke="#C4A86C" stroke-width="7" stroke-linecap="round" filter="url(#grainBlur)" opacity=".72"/>
    <rect x="34" y="112" width="360" height="154" rx="8" fill="url(#noise)" opacity=".92"/>
    <circle cx="102" cy="220" r="8" fill="#7CC49A" opacity=".65"/>
    <circle cx="238" cy="199" r="8" fill="#7CC49A" opacity=".55"/>
    <circle cx="365" cy="142" r="8" fill="#7CC49A" opacity=".50"/>
    <text x="0" y="350" fill="#C8C4BC" font-family="Segoe UI, system-ui, sans-serif" font-size="19">granulação, cor instável e detalhe suavizado</text>
  </g>
</svg>
