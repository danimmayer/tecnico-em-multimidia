<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Escala Kelvin para fotografia</title>
  <desc id="desc">Escala de temperatura de cor de 2000K a 10000K, de quente a fria.</desc>
  <defs>
    <linearGradient id="kelvin" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a33"/>
      <stop offset="0.22" stop-color="#ffc05f"/>
      <stop offset="0.48" stop-color="#fff7d6"/>
      <stop offset="0.68" stop-color="#cde7ff"/>
      <stop offset="1" stop-color="#668dff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="#141414"/>
  <g transform="translate(86 126)" font-family="Segoe UI, system-ui, sans-serif">
    <rect x="0" y="80" width="1028" height="86" rx="8" fill="url(#kelvin)"/>
    <rect x="0" y="80" width="1028" height="86" rx="8" fill="none" stroke="#fff" stroke-opacity="0.16"/>
    <g stroke="#f0f0ec" stroke-opacity="0.7" stroke-width="2">
      <path d="M0 66v126M206 66v126M411 66v126M617 66v126M822 66v126M1028 66v126"/>
    </g>
    <g fill="#f0f0ec" font-size="25" font-weight="700">
      <text x="-4" y="40">2000K</text>
      <text x="176" y="40">3200K</text>
      <text x="379" y="40">4500K</text>
      <text x="586" y="40">5500K</text>
      <text x="793" y="40">7000K</text>
      <text x="984" y="40">10000K</text>
    </g>
    <g fill="#c8c4bc" font-size="18">
      <text x="0" y="226">vela</text>
      <text x="166" y="226">tungstênio</text>
      <text x="367" y="226">nublado</text>
      <text x="570" y="226">luz do dia</text>
      <text x="792" y="226">sombra</text>
      <text x="948" y="226">céu azul</text>
    </g>
    <text x="0" y="302" fill="#f0f0ec" font-size="22">Número menor parece mais quente. Número maior parece mais frio.</text>
  </g>
</svg>
