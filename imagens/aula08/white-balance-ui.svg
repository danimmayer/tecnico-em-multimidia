<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Balanço de branco no celular e no editor</title>
  <desc id="desc">Mockup de interface com controles de temperatura, matiz e presets de balanço de branco.</desc>
  <rect width="1200" height="640" fill="#141414"/>
  <g transform="translate(120 70)">
    <rect x="0" y="0" width="280" height="500" rx="28" fill="#0c0e10" stroke="#fff" stroke-opacity="0.14"/>
    <rect x="20" y="44" width="240" height="346" rx="14" fill="#24211b"/>
    <rect x="20" y="44" width="120" height="346" rx="14" fill="#e0a35d" opacity="0.6"/>
    <rect x="140" y="44" width="120" height="346" rx="14" fill="#87aaf0" opacity="0.42"/>
    <circle cx="140" cy="217" r="58" fill="#d99965"/>
    <path d="M86 407h108" stroke="#c4a86c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="140" cy="450" r="22" fill="none" stroke="#f0f0ec" stroke-width="4"/>
    <text x="58" y="32" fill="#c8c4bc" font-family="Segoe UI, system-ui, sans-serif" font-size="17">Modo Pro</text>
  </g>
  <g transform="translate(493 96)" font-family="Segoe UI, system-ui, sans-serif">
    <rect width="580" height="442" rx="12" fill="#1b1b1b" stroke="#fff" stroke-opacity="0.08"/>
    <text x="34" y="54" fill="#f0f0ec" font-size="28" font-weight="700">Balanço de branco</text>
    <text x="34" y="88" fill="#c8c4bc" font-size="18">corrige a cor da luz, não a cor do objeto</text>
    <g transform="translate(34 124)">
      <rect width="512" height="62" rx="8" fill="#242424"/>
      <text x="20" y="38" fill="#f0f0ec" font-size="20">Temperatura</text>
      <rect x="194" y="28" width="268" height="8" rx="4" fill="#333"/>
      <rect x="194" y="28" width="146" height="8" rx="4" fill="#e3a45d"/>
      <circle cx="340" cy="32" r="14" fill="#f0d28a"/>
      <text x="472" y="39" fill="#c4a86c" font-size="18">4600K</text>
    </g>
    <g transform="translate(34 206)">
      <rect width="512" height="62" rx="8" fill="#242424"/>
      <text x="20" y="38" fill="#f0f0ec" font-size="20">Matiz</text>
      <rect x="194" y="28" width="268" height="8" rx="4" fill="#333"/>
      <rect x="248" y="28" width="140" height="8" rx="4" fill="#7cc49a"/>
      <circle cx="318" cy="32" r="14" fill="#b7e4c6"/>
      <text x="472" y="39" fill="#7cc49a" font-size="18">+6</text>
    </g>
    <g transform="translate(34 306)">
      <g fill="#1f1f1f" stroke="#fff" stroke-opacity="0.08">
        <rect width="108" height="74" rx="8"/>
        <rect x="128" width="108" height="74" rx="8"/>
        <rect x="256" width="108" height="74" rx="8"/>
        <rect x="384" width="108" height="74" rx="8"/>
      </g>
      <g fill="#f0f0ec" font-size="16" text-anchor="middle">
        <text x="54" y="33">AWB</text><text x="54" y="55" fill="#908880">auto</text>
        <text x="182" y="33">Sol</text><text x="182" y="55" fill="#908880">5500K</text>
        <text x="310" y="33">Tung.</text><text x="310" y="55" fill="#908880">3200K</text>
        <text x="438" y="33">Sombra</text><text x="438" y="55" fill="#908880">7500K</text>
      </g>
    </g>
