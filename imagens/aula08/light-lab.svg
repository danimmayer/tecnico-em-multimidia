<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Laboratório de luz natural e artificial</title>
  <desc id="desc">Mesa com objeto, janela, ring light e celular mostrando como o ambiente muda a fotografia.</desc>
  <defs>
