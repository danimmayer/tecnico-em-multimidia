<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Direções de luz</title>
  <desc id="desc">Quatro diagramas mostram luz frontal, lateral, contra-luz e zenital sobre o mesmo objeto.</desc>
  <defs>
    <radialGradient id="face" cx="0.36" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#e0a66b"/>
      <stop offset="0.62" stop-color="#9c623e"/>
      <stop offset="1" stop-color="#5e3827"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="620" fill="#141414"/>
  <g transform="translate(42 54)">
    <g id="panel">
      <rect width="254" height="426" rx="8" fill="#1b1b1b" stroke="#fff" stroke-opacity="0.08"/>
      <ellipse cx="127" cy="292" rx="82" ry="18" fill="#000" opacity="0.38"/>
      <circle cx="127" cy="188" r="72" fill="url(#face)"/>
    </g>
    <g fill="#f0f0ec" font-family="Segoe UI, system-ui, sans-serif">
      <text x="82" y="370" font-size="26" font-weight="700">Frontal</text>
      <text x="54" y="402" font-size="17" fill="#c8c4bc">detalhe, pouco volume</text>
    </g>
    <path d="M127 78v70" stroke="#f0d28a" stroke-width="9" stroke-linecap="round"/>
    <path d="m106 103 21-25 21 25" fill="none" stroke="#f0d28a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(323 54)">
    <use href="#panel"/>
    <rect x="127" y="116" width="72" height="144" rx="70" fill="#070707" opacity="0.36"/>
    <g fill="#f0f0ec" font-family="Segoe UI, system-ui, sans-serif">
      <text x="92" y="370" font-size="26" font-weight="700">Lateral</text>
      <text x="55" y="402" font-size="17" fill="#c8c4bc">volume, textura, contraste</text>
    </g>
    <path d="M38 188h78" stroke="#f0d28a" stroke-width="9" stroke-linecap="round"/>
    <path d="m88 165 28 23-28 23" fill="none" stroke="#f0d28a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(604 54)">
    <use href="#panel"/>
    <circle cx="127" cy="188" r="75" fill="none" stroke="#f0d28a" stroke-width="9" opacity="0.45"/>
    <circle cx="127" cy="188" r="72" fill="#090909" opacity="0.58"/>
    <path d="M103 232c18 13 47 13 66 0" stroke="#d7ab6d" stroke-opacity="0.42" stroke-width="8" fill="none" stroke-linecap="round"/>
    <g fill="#f0f0ec" font-family="Segoe UI, system-ui, sans-serif">
      <text x="68" y="370" font-size="26" font-weight="700">Contra-luz</text>
      <text x="57" y="402" font-size="17" fill="#c8c4bc">silhueta, recorte, clima</text>
    </g>
    <path d="M214 188h-72" stroke="#f0d28a" stroke-width="9" stroke-linecap="round"/>
    <path d="m168 165-26 23 26 23" fill="none" stroke="#f0d28a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(885 54)">
    <use href="#panel"/>
    <ellipse cx="127" cy="243" rx="54" ry="18" fill="#050505" opacity="0.44"/>
    <path d="M88 200c20 16 58 16 78 0" stroke="#050505" stroke-width="18" opacity="0.22" stroke-linecap="round"/>
    <g fill="#f0f0ec" font-family="Segoe UI, system-ui, sans-serif">
      <text x="91" y="370" font-size="26" font-weight="700">Zenital</text>
      <text x="55" y="402" font-size="17" fill="#c8c4bc">sombras duras, drama</text>
    </g>
    <path d="M127 70v74" stroke="#f0d28a" stroke-width="9" stroke-linecap="round"/>
    <path d="m106 119 21 25 21-25" fill="none" stroke="#f0d28a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
